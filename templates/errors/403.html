{% extends "base.html" %}

{% block title %}403 Access Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-danger mb-3">403</div>
    <h3 class="fw-bold mb-3">Access Forbidden</h3>
    <p class="text-muted mb-4">
      You do not have the required role or authorization to access this resource or modify this record.
    </p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary px-4">
      <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
