{% extends "base.html" %}

{% block title %}500 Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-warning mb-3">500</div>
    <h3 class="fw-bold mb-3">Internal Server Error</h3>
    <p class="text-muted mb-4">
      An unexpected error occurred while processing your request. The transaction has been safely rolled back.
    </p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary px-4">
      <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
